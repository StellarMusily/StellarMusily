[package]
name = "certificate"
version = "0.1.0"
edition = "2021"
description = "Tempo: non-transferable course completion certificates"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
